<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HausPilot · Review Queue</title><style>:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#171715;--muted:#6d6a62;--line:#d8d1c5;--ok:#d8ff62;--warn:#ffe1a8;--bad:#ffd1cc;--dark:#20271f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 60px}header{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{font-weight:900}.badge,.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:var(--paper);font-size:11px;font-weight:850}.hero{margin:42px 0 24px}h1{font-size:clamp(44px,7vw,76px);line-height:.94;letter-spacing:-.055em;margin:0 0 14px}.lead{color:var(--muted);max-width:760px;font-size:18px}.toolbar,.card{background:var(--paper);border:1px solid var(--line);border-radius:20px}.toolbar{padding:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);border-radius:11px;background:var(--paper);font-weight:800;padding:11px 14px;cursor:pointer}.btn.primary{background:var(--dark);color:white}.btn.accept{background:var(--ok)}.btn.edit{background:var(--warn)}.btn.reject{background:var(--bad)}input[type=file]{display:none}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{color:var(--muted);display:block}.stat b{font-size:28px}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.queue{background:var(--paper);border:1px solid var(--line);border-radius:18px;max-height:720px;overflow:auto;padding:8px}.q{padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}.q:hover,.q.active{border-color:var(--line);background:#f5f1e8}.q small{color:var(--muted)}.risk{float:right;font-weight:900}.card{padding:24px;min-height:520px}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.caseid{font-size:13px;color:var(--muted)}h2{font-size:34px;letter-spacing:-.04em;margin:4px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:14px;padding:14px}.box small{display:block;color:var(--muted);margin-bottom:6px}.evidence{font-size:14px;line-height:1.45}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.error{display:none;margin-top:12px}.error.show{display:block}select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:10px;font:inherit}textarea{min-height:72px;margin-top:8px}.empty{padding:50px 10px;color:var(--muted);text-align:center}@media(max-width:820px){.layout{grid-template-columns:1fr}.queue{max-height:260px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header><div class="brand">▦ HausPilot</div><span class="badge">HUMAN REVIEW · authority stays human</span></header><section class="hero"><h1>Review what<br>matters first.</h1><p class="lead">Batch-Ergebnis laden, riskante oder unsichere Fälle zuerst prüfen, mit ACCEPT / EDIT / REJECT entscheiden und strukturiertes Feedback exportieren. Keine JSON-Handarbeit.</p></section><div class="toolbar"><label class="btn primary" for="batch">Batch laden →</label><input id="batch" type="file" accept="application/json"><button class="btn" id="demo">Synthetic 5-case demo</button><button class="btn" id="export" disabled>Review exportieren</button><span id="filename" style="color:var(--muted);font-size:13px">Noch kein Run</span></div><div class="stats" id="stats"></div><div class="layout"><aside class="queue" id="queue"><div class="empty">Batch laden</div></aside><main class="card" id="detail"><div class="empty">Wähle einen Fall.</div></main></div></div><script>const ERR=['wrong_classification','wrong_property','missing_context','unsupported_claim','bad_draft','wrong_urgency','other'];let rows=[],queue=[],current=0,reviews={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function risk(row){const r=row.result||{};let score=0,reasons=[];if(row.ok===false){score+=100;reasons.push('runtime_error')}if(r.policy?.execution_allowed){score+=100;reasons.push('unsafe_execution')}const v=r.policy?.violations||[];if(v.length){score+=Math.min(40,v.length*10);reasons.push('policy_violation')}if(!r.property_id){score+=25;reasons.push('property_unresolved')}if((r.flags||[]).includes('property_ambiguous')){score+=30;reasons.push('property_ambiguous')}if((r.flags||[]).includes('prompt_injection_attempt')){score+=25;reasons.push('prompt_injection')}if((r.flags||[]).includes('bank_detail_change')){score+=35;reasons.push('bank_detail_change')}if(r.proposed_action?.consequential){score+=25;reasons.push('consequential')}if(r.proposed_action?.external){score+=15;reasons.push('external')}const c=Number(r.confidence);if(Number.isFinite(c)){score+=Math.round((1-c)*40);if(c<.75)reasons.push('low_confidence')}else{score+=20;reasons.push('confidence_missing')}return{score,reasons:[...new Set(reasons)]}}function rebuild(){queue=rows.map((row,index)=>({row,index,...risk(row)})).sort((a,b)=>b.score-a.score||String(a.row.case_id).localeCompare(String(b.row.case_id)));renderQueue();renderStats();if(queue.length){current=Math.min(current,queue.length-1);renderDetail()}}function renderStats(){const vals=Object.values(reviews),a=vals.filter(x=>x.decision==='ACCEPT').length,e=vals.filter(x=>x.decision==='EDIT').length,r=vals.filter(x=>x.decision==='REJECT').length;$('#stats').innerHTML=`<div class="stat"><small>Cases</small><b>${rows.length}</b></div><div class="stat"><small>Reviewed</small><b>${vals.length}</b></div><div class="stat"><small>Accept</small><b>${a}</b></div><div class="stat"><small>Edit</small><b>${e}</b></div><div class="stat"><small>Reject</small><b>${r}</b></div>`;$('#export').disabled=!vals.length}function renderQueue(){if(!queue.length){$('#queue').innerHTML='<div class="empty">Keine Fälle</div>';return}$('#queue').innerHTML=queue.map((q,i)=>{const rv=reviews[q.row.case_id];return `<div class="q ${i===current?'active':''}" data-i="${i}"><span class="risk">${q.score}</span><b>${esc(q.row.case_id)}</b><br><small>${esc(q.row.result?.classification||q.row.error||'—')} · ${rv?.decision||'OPEN'}</small></div>`}).join('');document.querySelectorAll('.q').forEach(el=>el.onclick=()=>{current=Number(el.dataset.i);renderQueue();renderDetail()})}function renderDetail(){const q=queue[current];if(!q)return;const r=q.row.result||{},rv=reviews[q.row.case_id]||{};$('#detail').innerHTML=`<div class="row"><div><div class="caseid">${esc(q.row.case_id)} · ${esc(q.row.template)}</div><h2>${esc(r.classification||'Runtime error')}</h2></div><div><span class="pill">risk ${q.score}</span> <span class="pill">${r.confidence!=null?Math.round(r.confidence*100)+'%':'—'}</span></div></div><div class="grid"><div class="box"><small>Property</small><b>${esc(r.property_id||'UNRESOLVED')}</b></div><div class="box"><small>Urgency</small><b>${esc(r.urgency||'—')}</b></div><div class="box"><small>Risk reasons</small>${q.reasons.map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'none'}</div><div class="box"><small>Flags</small>${(r.flags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join(' ')||'none'}</div></div><div class="box" style="margin-top:10px"><small>Summary</small>${esc(r.summary||q.row.error||'—')}</div><div class="box evidence" style="margin-top:10px"><small>Evidence</small>${(r.evidence||[]).map(x=>`<div>• <b>${esc(x.source)}</b> — ${esc(x.claim)}</div>`).join('')||'—'}</div><div class="box" style="margin-top:10px"><small>Proposed action</small>${esc(r.proposed_action?.description||'—')}<br><small>${r.proposed_action?.external?'external · ':''}${r.proposed_action?.consequential?'consequential':''}</small></div><div class="actions"><button class="btn accept" data-d="ACCEPT">A · ACCEPT</button><button class="btn edit" data-d="EDIT">E · EDIT</button><button class="btn reject" data-d="REJECT">R · REJECT</button></div><div class="error ${rv.decision&&rv.decision!=='ACCEPT'?'show':''}" id="error"><select id="err"><option value="">Fehlerklasse wählen…</option>${ERR.map(x=>`<option ${rv.error_class===x?'selected':''}>${x}</option>`).join('')}</select><textarea id="note" placeholder="Kurzer Hinweis (optional)">${esc(rv.note||'')}</textarea><button class="btn" id="saveErr">Speichern + nächster</button></div>`;document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>decide(b.dataset.d));if($('#saveErr'))$('#saveErr').onclick=()=>{const ec=$('#err').value;if(!ec)return alert('Bitte Fehlerklasse wählen.');reviews[q.row.case_id]={case_id:q.row.case_id,decision:rv.decision||'EDIT',error_class:ec,note:$('#note').value,reviewed_at:new Date().toISOString()};next()}}function decide(d){const q=queue[current];if(d==='ACCEPT'){reviews[q.row.case_id]={case_id:q.row.case_id,decision:d,error_class:null,note:'',reviewed_at:new Date().toISOString()};next();return}reviews[q.row.case_id]={case_id:q.row.case_id,decision:d,error_class:reviews[q.row.case_id]?.error_class||null,note:reviews[q.row.case_id]?.note||'',reviewed_at:new Date().toISOString()};renderQueue();renderStats();renderDetail()}function next(){renderStats();renderQueue();if(current<queue.length-1)current++;renderQueue();renderDetail()}function load(d,name){rows=d.rows||[];reviews={};current=0;$('#filename').textContent=name;rebuild()}$('#batch').onchange=async e=>{const f=e.target.files[0];if(f)load(JSON.parse(await f.text()),f.name)};$('#demo').onclick=()=>load({rows:Array.from({length:5},(_,i)=>({case_id:`demo-${i+1}`,template:i===3?'invoice_review':'tenant_inbox',ok:true,result:{classification:i===0?'ambiguous_request':'general_question',property_id:i===0?null:`OBJ-${i+1}`,urgency:'low',confidence:[.52,.68,.88,.91,.97][i],summary:'Synthetic review demo — not customer data.',evidence:[{source:'source_message',claim:'Synthetic evidence.'}],flags:i===3?['bank_detail_change']:[],proposed_action:{description:'Prepare for human review.',external:true,consequential:i===3},policy:{execution_allowed:false,violations:[]}}}))},'Synthetic demo — not customer results');$('#export').onclick=()=>{const doc={generated_at:new Date().toISOString(),reviews:Object.values(reviews)};const blob=new Blob([JSON.stringify(doc,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hauspilot-review-decisions.json';a.click();URL.revokeObjectURL(a.href)};document.addEventListener('keydown',e=>{if(/input|textarea|select/i.test(document.activeElement?.tagName||''))return;if(e.key.toLowerCase()==='a')decide('ACCEPT');if(e.key.toLowerCase()==='e')decide('EDIT');if(e.key.toLowerCase()==='r')decide('REJECT')});renderStats();</script></body></html>
