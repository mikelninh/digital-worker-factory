name: pilot-pages
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Trusted Agent Pilot surfaces
        run: |
          test -s site/pilot.css
          test -s site/trusted-agent-pilot.html
          test -s site/pilot-legal.html
          test -s site/pilot-brettinghams.html
          test -s site/pilot-government.html
          test -s site/pilot-healthcare.html
          grep -q "Give AI useful work" site/trusted-agent-pilot.html
          grep -q "Weniger Kanzlei-Routine" site/pilot-legal.html
          grep -q "Weniger Koordination" site/pilot-brettinghams.html
          grep -q "Staatliche Autorität bleibt beim Staat" site/pilot-government.html
          grep -q "Keine stille klinische Autorität" site/pilot-healthcare.html
          grep -q '"source": "/pilot"' site/vercel.json
          grep -q '"source": "/pilot/legal"' site/vercel.json
          grep -q '"source": "/pilot/brettinghams"' site/vercel.json
          grep -q '"source": "/pilot/government"' site/vercel.json
          grep -q '"source": "/pilot/healthcare"' site/vercel.json
      - name: Verify authority language stays explicit
        run: |
          grep -q "ALLOW" site/trusted-agent-pilot.html
          grep -q "APPROVAL" site/trusted-agent-pilot.html
          grep -q "BLOCK" site/trusted-agent-pilot.html
          grep -q "synthetischen oder redigierten" site/pilot-legal.html
          grep -q "unautorisierte Staatsaktionen" site/pilot-government.html
          grep -q "no autonomous treatment" site/pilot-healthcare.html
