name: LaunchCheck release gate

on:
  push:
    branches: [main, 'launchcheck-*']
    paths:
      - 'products/launchcheck/**'
      - '.github/workflows/launchcheck.yml'
  pull_request:
    paths:
      - 'products/launchcheck/**'
      - '.github/workflows/launchcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCP_URL: https://launchcheck-ai.netlify.app/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deterministic engine tests
        run: node --test products/launchcheck/tests/launchcheck.test.mjs products/launchcheck/tests/submission-metadata.test.mjs products/launchcheck/tests/routing-benchmark.test.mjs

      - name: Validate routing benchmark
        run: node products/launchcheck/routing/routing-score.mjs --validate-only

      - name: Validate plugin package JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('products/launchcheck/plugin/plugin.json','utf8')); JSON.parse(require('fs').readFileSync('products/launchcheck/plugin/mcp.json','utf8')); JSON.parse(require('fs').readFileSync('products/launchcheck/submission/golden-prompts.json','utf8'));"

      - name: MCP initialize
        run: npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method initialize --format json | tee /tmp/launchcheck-init.json

      - name: MCP tools list
        run: |
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/list --strict --format json | tee /tmp/launchcheck-tools.json
          grep -q 'audit_website' /tmp/launchcheck-tools.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/launchcheck-tools.json','utf8'));const n=(x.schemaFindings||[]).flatMap(g=>g.findings||[]).length;if(n){console.error('Schema portability findings:',JSON.stringify(x.schemaFindings,null,2));process.exit(1)}"

      - name: Live website audit
        run: |
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/call --tool-name audit_website --tool-args-json '{"url":"https://example.com","max_links":2}' --format json | tee /tmp/launchcheck-audit.json
          grep -q 'launchcheck/audit-v0.1' /tmp/launchcheck-audit.json

      - name: Private-network regression
        run: |
          npx -y @modelcontextprotocol/inspector --cli "$MCP_URL" --transport http --method tools/call --tool-name audit_website --tool-args-json '{"url":"http://127.0.0.1","max_links":0}' --format json | tee /tmp/launchcheck-private.json
          grep -Eq 'Private|private|reserved|local' /tmp/launchcheck-private.json
