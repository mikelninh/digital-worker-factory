name: security-delta-v1

on:
  pull_request:
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/autonomous-security-loop.mjs'
      - 'enterprise/examples/autonomous-loop-vulnerable-agent.json'
      - 'enterprise/security-delta.mjs'
      - 'enterprise/security-delta.test.mjs'
      - '.github/workflows/security-delta.yml'
  push:
    branches: [main]
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/autonomous-security-loop.mjs'
      - 'enterprise/examples/autonomous-loop-vulnerable-agent.json'
      - 'enterprise/security-delta.mjs'
      - 'enterprise/security-delta.test.mjs'
      - '.github/workflows/security-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run controlled mutation delta proof
        run: |
          node --test enterprise/security-delta.test.mjs
          node enterprise/security-delta.mjs
      - name: Assert evidence contract
        run: |
          node <<'NODE'
          const r = require('./enterprise/security-delta-proof.json')
          const s = r.summary
          if (r.version !== 'security-delta-target-proof/v1') throw new Error('wrong delta schema')
          if (s.before.impactEscapes !== s.attackCases) throw new Error('vulnerable fixture not vulnerable to every attack')
          if (s.after.impactEscapes !== 0) throw new Error('protected path has impact escape')
          if (s.holdout.contained !== s.holdout.total) throw new Error('holdout regression')
          if (s.benign.retentionRate !== 1) throw new Error('benign behavior regression')
          if (r.methodology.holdoutUsedForRemediation !== false) throw new Error('holdout leaked into remediation')
          if (r.mutation.historicalVulnerabilityClaimed !== false) throw new Error('truth boundary regression')
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: factory-security-delta-v1
          path: enterprise/security-delta-proof.json
