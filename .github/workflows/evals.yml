name: factory-evals
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 50-case synthetic reliability suite
        run: node evals/run.mjs
