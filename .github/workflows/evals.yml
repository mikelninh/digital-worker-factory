name: factory-evals
on:
  push:
    branches: [main]
  pull_request:

jobs:
  reliability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run 50-case synthetic reliability suite
        run: node evals/run.mjs
      - name: Run HausPilot template + policy safety suite
        run: node packs/hauspilot/runtime/eval.mjs
      - name: Run HausPilot runtime contract tests
        run: node --test packs/hauspilot/runtime/runtime.test.mjs
      - name: Run shared capability gateway contracts
        run: node --test core/agent-gateway.test.mjs core/providers/gitlaw.test.mjs core/factory-gateway.test.mjs
      - name: Run 30-scenario adversarial policy suite
        run: node packs/hauspilot/runtime/adversarial-eval.mjs
      - name: Run 60-case entity resolution benchmark
        run: node packs/hauspilot/runtime/entity-resolution-eval.mjs
      - name: Run 100-case tenant inbox gold set
        run: node packs/hauspilot/runtime/inbox-gold-eval.mjs
      - name: Run human review queue contract tests
        run: node --test packs/hauspilot/runtime/review.test.mjs
      - name: Run privacy fail-closed contract tests
        run: node --test packs/hauspilot/privacy/privacy.test.mjs
      - name: Run stakeholder end-to-end simplicity tests
        run: node --test packs/hauspilot/runtime/stakeholder-e2e.test.mjs
      - name: Run simple next-action tests
        run: node --test packs/hauspilot/runtime/next-action.test.mjs
      - name: Run assistant end-to-end operator tests
        run: |
          node --check packs/hauspilot/operator/ops-console.mjs
          node --check packs/hauspilot/operator/review-package.mjs
          node --check packs/hauspilot/operator/activate-release.mjs
          node --check packs/hauspilot/operator/admin-ready.mjs
          node --test packs/hauspilot/operator/assistant-flow.test.mjs
          node --test packs/hauspilot/operator/console-e2e.test.mjs
          node --test packs/hauspilot/operator/stakeholder-edge-cases.test.mjs
          node --test packs/hauspilot/operator/release-lock.test.mjs
          test -s start-hauspilot-ops.cmd
          test -s packs/hauspilot/operator/ASSISTANT_READY.md
          test -s packs/hauspilot/first-customer/templates/repair-cases.csv
          test -s packs/hauspilot/first-customer/templates/inbox-cases.csv
          test -s packs/hauspilot/first-customer/templates/invoice-cases.csv
          test -s packs/hauspilot/first-customer/templates/properties.csv
      - name: Validate 100-case real-model release dataset
        run: node packs/hauspilot/runtime/live-release-gate.mjs --dry-run
      - name: Generate 20-case first-customer demo
        run: node packs/hauspilot/first-customer/generate-demo.mjs /tmp/hauspilot-demo
      - name: Preflight first-customer demo
        run: node packs/hauspilot/runtime/preflight.mjs /tmp/hauspilot-demo
      - name: Generate first-customer privacy proof
        run: |
          node packs/hauspilot/privacy/manifest.mjs /tmp/hauspilot-demo /tmp/hauspilot-demo/privacy-manifest.json
          test -s /tmp/hauspilot-demo/privacy-manifest.json
      - name: Generate first-customer demo report
        run: |
          node packs/hauspilot/runtime/report.mjs /tmp/hauspilot-demo/mock-results.json /tmp/hauspilot-demo/measurement.json /tmp/hauspilot-demo-report.html
          test -s /tmp/hauspilot-demo-report.html
          grep -q "Drei Antworten" /tmp/hauspilot-demo-report.html
          grep -q "Technische Details & Audit öffnen" /tmp/hauspilot-demo-report.html
      - name: Verify customer-facing explainer pages
        run: |
          test -s site/hauspilot.html
          test -s site/hauspilot-onepager.html
          test -s site/hauspilot-privacy.html
          test -s site/agent-capabilities.html
          grep -q "Ein Prozess" site/hauspilot.html
          grep -q "100/100" site/hauspilot.html
          grep -q "Datenschutz ist ein Gate" site/hauspilot-privacy.html
          grep -q "Build capabilities agents can be trusted to use" site/agent-capabilities.html
          grep -q "Blocked before network" site/agent-capabilities.html
      - name: Verify radically simplified operating interface
        run: |
          test -s site/simple-operations.html
          test -s packs/hauspilot/operator/ONE_PAGE.md
          grep -q "Ein Ablauf" site/simple-operations.html
          grep -q "20–50 Beispiele" site/simple-operations.html
          grep -q "STARTEN" site/simple-operations.html
          grep -q "Richtig" site/simple-operations.html
          grep -q "ausdrücklich" site/simple-operations.html
          grep -q "Was ist mein nächster Klick" packs/hauspilot/operator/ONE_PAGE.md
      - name: Verify existing role-based pilot command center
        run: |
          test -s site/pilot-command-center.html
          test -s packs/hauspilot/operator/PLAYBOOK.md
          grep -q "Operations Assistant" site/pilot-command-center.html
      - name: Verify managed operations retainer flow
        run: |
          test -s site/retainer-command-center.html
          test -s packs/hauspilot/operator/RETAINER_PLAYBOOK.md
          grep -q "ACTIVE_MANAGED_OPS" packs/hauspilot/operator/RETAINER_PLAYBOOK.md
      - name: Run managed operations state-machine tests
        run: node --test packs/hauspilot/retainer/state.test.mjs
      - name: Smoke retainer workspace generator
        run: |
          node packs/hauspilot/retainer/new-retainer.mjs --id ci-demo --customer "CI Demo GmbH" --reviewer "Reviewer" --operator "Ops" --workflow repair_intake --fee 750
          test -s retainers/ci-demo/retainer.json
          test -s retainers/ci-demo/cycles/$(date +%Y-%m)/cycle.json
          grep -q "ACTIVE_MANAGED_OPS" retainers/ci-demo/retainer.json
      - name: Run HausPilot V1.1 five-customer regression
        run: |
          node packs/hauspilot/simulations/five-customers-v1-1.mjs /tmp/hauspilot-five-v11
          test -s /tmp/hauspilot-five-v11/summary.json
