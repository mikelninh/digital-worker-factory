name: agent-commerce-rc0

on:
  pull_request:
    paths:
      - 'agent-commerce/**'
      - 'formal/**'
      - 'core/**'
      - 'render.yaml'
      - '.dockerignore'
      - '.github/workflows/agent-commerce.yml'
  push:
    branches: [main]
    paths:
      - 'agent-commerce/**'
      - 'formal/**'
      - 'core/**'
      - 'render.yaml'
      - '.dockerignore'
      - '.github/workflows/agent-commerce.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned x402 dependencies
        working-directory: agent-commerce
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: agent-commerce
        run: npm run check
      - name: Run bounded production-kernel model check
        run: node formal/ocn-kernel-model.mjs
      - name: Run independent TLA+ trust state-machine model check
        run: |
          curl -fL --retry 3 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            -o /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum -c -
          java -XX:+UseParallelGC -jar /tmp/tla2tools.jar \
            -config formal/OCNTrustKernel.cfg \
            formal/OCNTrustKernel.tla
      - name: Run payment, trust and authority contract tests
        working-directory: agent-commerce
        run: npm test
      - name: Build RC0 production container
        run: docker build -f agent-commerce/Dockerfile -t agent-commerce-rc0:test .
      - name: Build OCN trust rail production container
        run: docker build -f agent-commerce/Dockerfile.network -t open-capability-network:test .
      - name: Verify no private keys or mainnet defaults were committed
        run: |
          ! grep -R -E "(EVM_PRIVATE_KEY|0x[0-9a-fA-F]{64})" agent-commerce \
            --exclude='*.md' \
            --exclude-dir=node_modules
          grep -q "eip155:84532" agent-commerce/commerce-core.mjs
          grep -q "mainnet_requires_explicit_ALLOW_MAINNET" agent-commerce/server.mjs
          grep -q "eip155:84532" agent-commerce/Dockerfile.network
