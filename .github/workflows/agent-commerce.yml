name: agent-commerce-rc0

on:
  pull_request:
    paths:
      - 'agent-commerce/**'
      - 'core/**'
      - '.dockerignore'
      - '.github/workflows/agent-commerce.yml'
  push:
    branches: [main]
    paths:
      - 'agent-commerce/**'
      - 'core/**'
      - '.dockerignore'
      - '.github/workflows/agent-commerce.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned x402 dependencies
        working-directory: agent-commerce
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        working-directory: agent-commerce
        run: npm run check
      - name: Run payment and authority contract tests
        working-directory: agent-commerce
        run: npm test
      - name: Build portable production container
        run: docker build -f agent-commerce/Dockerfile -t agent-commerce-rc0:test .
      - name: Verify no private keys or mainnet defaults were committed
        run: |
          ! grep -R -E "(EVM_PRIVATE_KEY|0x[0-9a-fA-F]{64})" agent-commerce \
            --exclude='*.md' \
            --exclude-dir=node_modules
          grep -q "eip155:84532" agent-commerce/commerce-core.mjs
          grep -q "mainnet_requires_explicit_ALLOW_MAINNET" agent-commerce/server.mjs
