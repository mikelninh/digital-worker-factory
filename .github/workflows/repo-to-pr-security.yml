name: repo-to-pr-security-v3

on:
  push:
    branches: [main]
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/capability-registry.mjs'
      - 'core/policy-gate.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/**'
      - '.github/workflows/repo-to-pr-security.yml'
  pull_request:
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/capability-registry.mjs'
      - 'core/policy-gate.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/**'
      - '.github/workflows/repo-to-pr-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check security engine syntax
        run: |
          node --check enterprise/repository-discovery.mjs
          node --check enterprise/repository-autofix.mjs
          node --check enterprise/repo-security-orchestrator.mjs
          node --check enterprise/autonomous-security-loop.mjs
          node --check enterprise/effect-sandbox.mjs
          node --check enterprise/continuous-assurance.mjs
          python3 -m py_compile enterprise/examples/repo-python-autofix-target/agent.py
      - name: Run repo-to-PR JS + Python proofs
        run: node --test enterprise/repo-security-orchestrator.test.mjs
      - name: Run real-effect sandbox proof
        run: node --test enterprise/effect-sandbox.test.mjs
      - name: Run continuous authority-delta gate
        run: node --test enterprise/continuous-assurance.test.mjs
      - name: Export machine-readable repo-to-PR evidence
        run: node enterprise/export-repo-security-report.mjs
      - name: Require portable runtime containment
        run: |
          node -e "const r=require('./enterprise/repo-security-report.json'); if(r.version!=='repo-security-loop/v2') throw new Error('invalid repo-security version'); if(r.runtimeBefore?.impactEscapes!==4||r.runtimeBefore?.executorCalls!==4) throw new Error('portable runtime exploit not reproduced'); if(r.runtimeAfter?.impactEscapes!==0||r.runtimeAfter?.executorCalls!==0) throw new Error('runtime impact remains after patch'); if(r.release?.decision!=='TECHNICAL_GO'||r.pr?.ready!==true) throw new Error('generated remediation is not PR-ready'); if((r.before?.attackLoop?.attacks?.generated||0)<4) throw new Error('insufficient capability-specific attack coverage'); console.log('Repo-to-PR: exploitable -> patched -> 0 executor impact; TECHNICAL_GO')"
      - name: Verify Python runtime golden case independently
        run: |
          node enterprise/repo-security-cli.mjs enterprise/examples/repo-python-autofix-target --autofix --out=/tmp/python-autofix.json
          node -e "const r=require('/tmp/python-autofix.json'); if(r.runtimeBefore?.impactEscapes!==4||r.runtimeAfter?.impactEscapes!==0||r.runtimeAfter?.executorCalls!==0) throw new Error('Python 4->0 proof failed'); if(r.release?.decision!=='TECHNICAL_GO') throw new Error('Python remediation is not TECHNICAL_GO'); console.log('Python executor: 4 escapes -> 0')"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-security-evidence
          path: enterprise/repo-security-report.json

  real-safevoice-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TrustReady engine
        uses: actions/checkout@v4
        with:
          path: engine
      - name: Checkout real SafeVoice repository
        uses: actions/checkout@v4
        with:
          repository: mikelninh/safevoice
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Discover real Python agent and isolated MCP surface
        working-directory: engine
        run: node enterprise/repo-security-cli.mjs ../target --out=../safevoice-repo-discovery.json
      - name: Require resolved reachability and supported Python remediation
        run: |
          node -e "const r=require('./safevoice-repo-discovery.json'); const d=r.discovery; if(r.version!=='repo-security-loop/v2') throw new Error('invalid repo-security version'); if(d.agentTopology?.entrypoints?.length!==1||d.agentTopology.entrypoints[0]!=='backend/app/services/court_prep_agent.py') throw new Error('SafeVoice entrypoint not resolved'); if(d.agentTopology?.frameworks?.length!==1||d.agentTopology.frameworks[0]!=='backend/app/services/agent_loop.py') throw new Error('SafeVoice framework not resolved'); if(d.mcpServers.length<1) throw new Error('SafeVoice MCP server missing'); if(d.reachability?.isolatedMcpServers?.length<1) throw new Error('independent MCP surface was not isolated'); if(d.reachability?.reachableMcpServers?.length!==0) throw new Error('unobserved MCP reachability must not be invented'); if(d.reachableTools.length<5) throw new Error('Court-Prep tool surface not discovered'); if(d.isolatedTools.length<1) throw new Error('isolated MCP tools not retained as evidence'); if(d.controls.boundedExecution!==true||d.controls.auditTrail!==true||d.controls.directModelToToolExecutor!==true) throw new Error('SafeVoice runtime controls not discovered'); if(r.release?.decision!=='TECHNICAL_NO_GO') throw new Error('unpatched SafeVoice should require remediation'); if(r.patch?.supported!==true||r.patch?.reason!=='insert_python_deterministic_boundary_before_model_selected_handler') throw new Error('SafeVoice Python autofix not supported'); console.log('SafeVoice: reachability resolved; independent MCP isolated; Python autofix supported')"
      - name: Prove discovery did not modify SafeVoice
        run: test -z "$(git -C target status --porcelain)"
      - name: Upload real-repo evidence
        uses: actions/upload-artifact@v4
        with:
          name: safevoice-repository-discovery
          path: safevoice-repo-discovery.json
