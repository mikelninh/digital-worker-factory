name: repo-to-pr-security-v2

on:
  push:
    branches: [main]
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/capability-registry.mjs'
      - 'core/policy-gate.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/autonomous-security-loop.mjs'
      - 'enterprise/repository-discovery.mjs'
      - 'enterprise/repository-autofix.mjs'
      - 'enterprise/repo-security-*'
      - 'enterprise/examples/repo-autofix-target/**'
      - '.github/workflows/repo-to-pr-security.yml'
  pull_request:
    paths:
      - 'core/agent-gateway.mjs'
      - 'core/capability-registry.mjs'
      - 'core/policy-gate.mjs'
      - 'core/security-boundary.mjs'
      - 'enterprise/autonomous-security-loop.mjs'
      - 'enterprise/repository-discovery.mjs'
      - 'enterprise/repository-autofix.mjs'
      - 'enterprise/repo-security-*'
      - 'enterprise/examples/repo-autofix-target/**'
      - '.github/workflows/repo-to-pr-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supported-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test repository discovery, fail-closed logic and code-level retest
        run: node --test enterprise/repo-security-orchestrator.test.mjs
      - name: Export machine-readable repo-to-PR evidence
        run: node enterprise/export-repo-security-report.mjs
      - name: Require exploit-before-fix and zero executor impact after code patch
        run: |
          node <<'NODE'
          const r = require('./enterprise/repo-security-report.json')
          if (r.version !== 'repo-security-loop/v1') throw new Error('invalid repo-security version')
          if (r.runtimeBefore?.impactEscapes !== 4) throw new Error(`expected 4 runtime escapes before, got ${r.runtimeBefore?.impactEscapes}`)
          if (r.runtimeBefore?.executorCalls !== 4) throw new Error(`expected 4 executor calls before, got ${r.runtimeBefore?.executorCalls}`)
          if (r.runtimeAfter?.impactEscapes !== 0) throw new Error('runtime impact escape remains after code patch')
          if (r.runtimeAfter?.executorCalls !== 0) throw new Error('executor call remains after code patch')
          if (r.release?.decision !== 'TECHNICAL_GO') throw new Error(`unexpected release decision: ${r.release?.decision}`)
          if (r.pr?.ready !== true) throw new Error('generated PR is not ready')
          console.log(`Repo-to-PR: ${r.runtimeBefore.impactEscapes} runtime escapes -> ${r.runtimeAfter.impactEscapes}; executor calls after=${r.runtimeAfter.executorCalls}; ${r.release.decision}`)
          NODE
      - name: Upload repo-to-PR evidence
        uses: actions/upload-artifact@v4
        with:
          name: repo-security-report
          path: enterprise/repo-security-report.json

  real-safevoice-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TrustReady engine
        uses: actions/checkout@v4
        with:
          path: engine
      - name: Checkout real SafeVoice repository
        uses: actions/checkout@v4
        with:
          repository: mikelninh/safevoice
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Discover real agent and MCP surfaces without modifying target
        working-directory: engine
        run: node enterprise/repo-security-cli.mjs ../target --out=../safevoice-repo-discovery.json
      - name: Require evidence-backed discovery and fail closed on ambiguous reachability
        run: |
          node <<'NODE'
          const r = require('./safevoice-repo-discovery.json')
          const d = r.discovery
          if (r.version !== 'repo-security-loop/v1') throw new Error('invalid repo-security version')
          if (!d || d.agents.length < 1) throw new Error('SafeVoice agent runtime not discovered')
          if (d.mcpServers.length < 1) throw new Error('SafeVoice MCP server not discovered')
          if (d.controls.boundedExecution !== true) throw new Error('SafeVoice execution budget not discovered')
          if (d.controls.auditTrail !== true) throw new Error('SafeVoice audit trail not discovered')
          if (d.controls.directModelToToolExecutor !== true) throw new Error('SafeVoice model-to-tool dispatch not discovered')
          if (r.release?.decision !== 'TECHNICAL_NO_GO') throw new Error('ambiguous real repo must fail closed')
          if (!d.coverage.blockers.some((x) => x.includes('reachability_review'))) throw new Error('reachability ambiguity blocker missing')
          if (r.patch?.supported !== false) throw new Error('real repo must not be rewritten without a proven supported shape')
          console.log(`SafeVoice discovery: agents=${d.agents.length}; MCP=${d.mcpServers.length}; tools=${d.tools.length}; decision=${r.release.decision}; auto-patch=${r.patch.supported}`)
          NODE
      - name: Prove discovery scan did not modify target repository
        run: test -z "$(git -C target status --porcelain)"
      - name: Upload real-repo discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: safevoice-repository-discovery
          path: safevoice-repo-discovery.json
