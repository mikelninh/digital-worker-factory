name: ocn-distribution

on:
  pull_request:
    paths:
      - 'distribution/**'
      - '.github/workflows/ocn-distribution.yml'
  push:
    branches:
      - 'feat/gov-launch-actual'
    paths:
      - 'distribution/**'
      - '.github/workflows/ocn-distribution.yml'

permissions:
  contents: read

jobs:
  mcp-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: distribution/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fresh install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Safety contract tests
        run: npm test
      - name: Verify no buyer key committed
        working-directory: .
        run: |
          if git grep -nE 'OCN_BUYER_EVM_KEY=0x[a-fA-F0-9]{64}' -- ':!distribution/mcp/index.test.mjs'; then
            echo 'A buyer private key appears to be committed.' >&2
            exit 1
          fi
