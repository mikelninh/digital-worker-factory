name: Caya proof regression

on:
  pull_request:
    paths:
      - "packs/caya-one-less-click/**"
      - ".github/workflows/caya-proof.yml"
  push:
    branches: [main]
    paths:
      - "packs/caya-one-less-click/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node packs/caya-one-less-click/run-evals.mjs
